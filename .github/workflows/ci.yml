name: C2Stack CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  portal-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Install portal test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r Docker/portal/requirements-test.txt
      - name: Install Chromium for browser security tests
        run: python -m playwright install --with-deps chromium
      - name: Run portal tests
        run: python -m pytest -q Docker/portal
      - name: Check portal browser bundle syntax
        run: node --check Docker/portal/static/portal.js
      - name: Check portal rendering of hostile session metadata
        run: node Docker/tests/portal-ui-security.test.cjs
      - name: Validate Compose configuration without starting services
        run: |
          env_file="$RUNNER_TEMP/c2stack-ci.env"
          cp Docker/.env.example "$env_file"
          for name in HAVOC_OPERATOR_PASSWORD HAVOC_SERVICE_PASSWORD ADAPTIX_TEAMSERVER_PASSWORD MYTHIC_ADMIN_PASSWORD MYTHIC_DB_PASSWORD MYTHIC_RABBITMQ_PASSWORD KALI_VNC_PASSWORD; do
            printf '%s=%s\n' "$name" "$(openssl rand -hex 32)" >> "$env_file"
          done
          set -a
          . "$env_file"
          set +a
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          template = Path("Docker/mythic/apollo/rabbitmq_config.template.json")
          generated = Path("Docker/mythic/apollo/rabbitmq_config.generated.json")
          config = json.loads(template.read_text(encoding="utf-8"))
          config["rabbitmq_password"] = os.environ["MYTHIC_RABBITMQ_PASSWORD"]
          generated.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          PY
          docker compose --env-file "$env_file" -f Docker/docker-compose.yml --profile mythic --profile adaptix config --quiet
          docker compose --env-file "$env_file" -f Docker/docker-compose.kali.yml config --quiet
      - name: Verify generated Apache routing configuration
        run: bash Docker/tests/validate-apache-render.sh
      - name: Verify Linux bootstrap argument vectors and generated secrets
        run: bash Docker/tests/test-bootstrap.sh

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: Docker/meridian/implant/go.mod
          cache: true
          cache-dependency-path: Docker/meridian/implant/go.sum
      - name: Test Meridian implant
        working-directory: Docker/meridian/implant
        run: go test -count=1 ./...
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: Docker/adaptix/src/AdaptixServer/go.mod
          cache: true
          cache-dependency-path: Docker/adaptix/src/AdaptixServer/go.sum
      - name: Test Adaptix task-correlation paths
        working-directory: Docker/adaptix/src/AdaptixServer
        run: go test -vet=off ./core/server ./core/connector

  windows-bootstrap:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Verify PowerShell bootstrap argument vectors and generated secrets
        shell: pwsh
        run: ./Docker/tests/test-bootstrap.ps1

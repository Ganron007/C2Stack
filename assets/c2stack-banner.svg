<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif">
  <!-- Solid Background -->
  <rect width="960" height="320" fill="#0d1117"/>
  
  <!-- Grid Pattern -->
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#161b22" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="960" height="320" fill="url(#grid)"/>
  
  <!-- Left Diagonal Red Lines -->
  <!-- Parallel lines with slope -2 -->
  <line x1="160" y1="0" x2="0" y2="320" stroke="#da3633" stroke-width="5"/>
  <line x1="175" y1="0" x2="15" y2="320" stroke="#da3633" stroke-width="2"/>
  
  <!-- Bottom Red Accent Bar -->
  <rect x="0" y="312" width="960" height="8" fill="#da3633"/>
  
  <!-- Main Title -->
  <text x="480" y="115" fill="#ffffff" font-size="60" font-weight="800" text-anchor="middle" letter-spacing="1">C2Stack</text>
  
  <!-- Title Underline -->
  <line x1="380" y1="140" x2="580" y2="140" stroke="#da3633" stroke-width="3"/>
  
  <!-- Subtitle -->
  <text x="480" y="187" fill="#c9d1d9" font-size="20" font-weight="400" text-anchor="middle">C2 Framework Training Environment</text>
  
  <!-- Row 1: Frameworks (Monospace) -->
  <text x="480" y="240" fill="#58a6ff" font-size="15" font-family="'Courier New', Courier, monospace" text-anchor="middle">Mythic  ·  Sliver  ·  Havoc  ·  Apache Redirector</text>
  
  <!-- Row 2: Infrastructure (Monospace) -->
  <text x="480" y="270" fill="#8b949e" font-size="15" font-family="'Courier New', Courier, monospace" text-anchor="middle">red-team infrastructure  ·  Docker containers  ·  operator clients</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="620" height="180" viewBox="0 0 620 180" role="img" aria-label="C2Stack logo">
  <defs>
    <!-- Base Shield Gradient (Dark Brown) -->
    <linearGradient id="amberGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="55%" stop-color="#4c2106"/>
      <stop offset="100%" stop-color="#2b1102"/>
    </linearGradient>
    <!-- Wordmark Gradient -->
    <linearGradient id="wordGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
  </defs>

  <!-- Shield icon with redirector/framework hub-and-spoke star network -->
  <g transform="translate(24,28)">
    <!-- Sleek outer shield path -->
    <path d="M55 0 L110 18 V62 C110 100 86 128 55 145 C24 128 0 100 0 62 V18 Z"
          fill="url(#amberGrad)" stroke="#2b1102" stroke-width="2"/>
          
    <!-- AI Sparkle in upper-right area -->
    <path d="M85 24 Q85 32 93 32 Q85 32 85 40 Q85 32 77 32 Q85 32 85 24 Z" fill="#ffffff" opacity="0.9"/>
    
    <!-- Hub-and-Spoke Redirector network -->
    <!-- Connector lines -->
    <line x1="55" y1="50" x2="30" y2="90" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="55" y1="50" x2="55" y2="95" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="55" y1="50" x2="80" y2="90" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Center node (Redirector) -->
    <circle cx="55" cy="50" r="10" fill="#ffffff" opacity="0.95"/>
    
    <!-- 3 framework target nodes (Mythic, Sliver, Havoc) -->
    <circle cx="30" cy="90" r="7.5" fill="#ffffff" opacity="0.95"/>
    <circle cx="55" cy="95" r="7.5" fill="#ffffff" opacity="0.95"/>
    <circle cx="80" cy="90" r="7.5" fill="#ffffff" opacity="0.95"/>
    
    <!-- Callback listener signal waves -->
    <path d="M41 36 A 18 18 0 0 1 69 36" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
    <path d="M32 27 A 28 28 0 0 1 78 27" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Wordmark -->
  <text x="160" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="56" font-weight="800" fill="url(#wordGrad)" letter-spacing="-1">C2Stack</text>
        
  <!-- Tagline under the wordmark -->
  <text x="162" y="120" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="19" font-weight="600" fill="#6b7280" letter-spacing="0.4">Docker-First C2 Framework Training Environment</text>
</svg>

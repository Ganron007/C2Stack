# ============================================================================
# C2Stack — Docker Practice Lab
# Redirector + Sliver + Havoc (default) + Mythic + Adaptix (profile-gated).
# The Kali VM is the operator workstation (runs sliver-client / havoc client /
# Adaptix Qt GUI / browser to Mythic UI).
#
# Default (lightweight):
#   docker compose --env-file .env up -d --build
# With Mythic:
#   docker compose --env-file .env --profile mythic up -d --build
# With Adaptix (builds from source, ~5-10 min first run):
#   docker compose --env-file .env --profile adaptix up -d --build
# All four frameworks:
#   docker compose --env-file .env --profile mythic --profile adaptix up -d --build
#
# Networks:
#   c2_edge  - redirector publishes its victim-facing port here
#   c2_core  - internal back-channel; C2 frameworks are only reachable through
#              the redirector (no direct internet egress)
# ============================================================================

name: c2stack

networks:

  c2_edge:
    name: ${C2_EDGE_NETWORK}
  c2_core:
    name: ${C2_CORE_NETWORK}
    internal: true

volumes:
  sliver_data:
  havoc_data:
  adaptix_data:
  meridian_data:
  mythic_postgres:

services:
  # ------------------------------------------------------------------
  # Redirector — Apache reverse proxy with header-based C2 routing.
  # The ONLY service exposed to the victim/CADRE network.
  # ------------------------------------------------------------------
  redirector:
    build:
      context: ./redirector
    environment:
      # NOTE: every var carries a :- default on purpose. Without one, a blank
      # value in .env yields e.g. `%{HTTP:}` which matches everything and turns
      # the header-gated router into an open proxy onto the C2 backends.
      C2_HEADER_NAME: ${C2_HEADER_NAME:-X-Request-ID}
      C2_HEADER_VALUE: ${C2_HEADER_VALUE:-cadre-c2}
      MYTHIC_URI_PREFIX: ${MYTHIC_URI_PREFIX:-/cdn/media/stream}
      MYTHIC_HTTPX_URI_PREFIX: ${MYTHIC_HTTPX_URI_PREFIX:-/media/uploads}
      SLIVER_URI_PREFIX: ${SLIVER_URI_PREFIX:-/cloud/storage/objects}
      HAVOC_URI_PREFIX: ${HAVOC_URI_PREFIX:-/edge/cache/assets}
      ADAPTIX_URI_PREFIX: ${ADAPTIX_URI_PREFIX:-/api/v1/sync}
      MERIDIAN_URI_PREFIX: ${MERIDIAN_URI_PREFIX:-/gateway/v1/telemetry}
      MYTHIC_BACKEND_HOST: ${MYTHIC_BACKEND_HOST:-mythic_http}
      MYTHIC_BACKEND_PORT: ${MYTHIC_BACKEND_PORT:-80}
      MYTHIC_HTTPX_BACKEND_HOST: ${MYTHIC_HTTPX_BACKEND_HOST:-mythic_httpx}
      MYTHIC_HTTPX_BACKEND_PORT: ${MYTHIC_HTTPX_BACKEND_PORT:-82}
      # Sliver's HTTP implant sends no custom headers, so its route is matched on
      # the high-entropy session path alone ("off") or gated like the others.
      SLIVER_HEADER_GATE: ${SLIVER_HEADER_GATE:-on}
      SLIVER_BACKEND_HOST: ${SLIVER_BACKEND_HOST:-sliver}
      SLIVER_BACKEND_PORT: ${SLIVER_BACKEND_PORT:-80}
      HAVOC_BACKEND_HOST: ${HAVOC_BACKEND_HOST:-havoc}
      HAVOC_BACKEND_PORT: ${HAVOC_BACKEND_PORT:-80}
      ADAPTIX_BACKEND_HOST: ${ADAPTIX_BACKEND_HOST:-adaptix}
      ADAPTIX_BACKEND_PORT: ${ADAPTIX_BACKEND_PORT:-80}
      MERIDIAN_BACKEND_HOST: ${MERIDIAN_BACKEND_HOST:-meridian}
      MERIDIAN_BACKEND_PORT: ${MERIDIAN_BACKEND_PORT:-8080}
    ports:
      - "${REDIRECTOR_HTTP_PORT}:80"
    networks:
      - c2_edge
      - c2_core
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Sliver C2
  # ------------------------------------------------------------------
  sliver:
    build:
      context: ./sliver
    # bootstrap.sh starts the daemon, mints the 'cadre' operator config and
    # creates the HTTP C2 listener on :80 (explicit container IPv4 --lhost,
    # website edge) so payloads call back through the redirector out of the
    # box. There is no rootpath knob: the server catch-all routes any path
    # under the redirector's /cloud/storage/objects prefix to the implant.
    volumes:
      - sliver_data:/root/.sliver
      - ./sliver/bootstrap.sh:/bootstrap.sh:ro
    entrypoint: ["/bin/bash", "/bootstrap.sh"]
    ports:
      - "${SLIVER_CTRL_PORT}:31337"
    networks:
      - c2_core
      - c2_edge
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Havoc C2 (teamserver)
  # ------------------------------------------------------------------
  havoc:
    build:
      context: ./havoc
    volumes:
      - havoc_data:/opt/havoc/teamserver/data
      # Bind-mount the repo profile OVER the one inside the data volume.
      # The teamserver runs as `./havoc server -d` with no -profile flag, so it
      # loads /opt/havoc/teamserver/data/havoc.yaotl - which the named volume
      # otherwise shadows with a stale copy. That drift is invisible until a
      # payload is built: the beacon bakes in the listener Hosts, so a stale
      # profile makes every callback go to the wrong address with no error.
      - ./havoc/havoc.yaotl:/opt/havoc/teamserver/data/havoc.yaotl:ro
    ports:
      - "${HAVOC_TS_PORT}:40056"
    networks:
      - c2_core
      - c2_edge
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Mythic C2 (profile-gated: enable with --profile mythic)
  # Modern Mythic (single Go server container + embedded init; external
  # Postgres + RabbitMQ as separate services). In Mythic 3.4 the server is
  # a pure orchestrator: payload types / C2 profiles / translators are
  # SIBLING containers that self-register over RabbitMQ sync queues
  # (pt_sync / c2_sync / tr_sync) - no docker socket or mythic-cli needed.
  # mythic-cli is only a docker-compose generator; the wiring below replaces
  # it directly. Server image pinned to the highest stable GHCR tag (v4 is
  # RC-only; the `latest` tag is explicitly marked "test containers").
  # The http C2 profile comes from the MythicC2Profiles ORG (separate from
  # the main Mythic repo): ghcr.io/mythicc2profiles/http:v0.0.3.2. It
  # self-registers the same way and serves the agent-facing :80 listener;
  # the redirector routes /cdn/media/stream to it.
  # ------------------------------------------------------------------
  mythic_server:
    image: ghcr.io/its-a-feature/mythic_server:v3.4.0.61
    profiles: ["mythic"]
    ports:
      - "${MYTHIC_UI_PORT}:17443"
    volumes:
      - ./mythic/server:/mythic
    depends_on:
      - mythic_postgres
      - mythic_rabbitmq
    environment:
      POSTGRES_HOST: mythic_postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: mythic_db
      POSTGRES_USER: mythic_user
      POSTGRES_PASSWORD: mythic
      RABBITMQ_HOST: mythic_rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: mythic_user
      RABBITMQ_PASSWORD: mythic
      MYTHIC_ADMIN_USER: mythic_admin
      MYTHIC_ADMIN_PASSWORD: mythic
    networks:
      - c2_core
      - c2_edge
    restart: unless-stopped

  # Apollo payload-type container (self-registers with the server over
  # RabbitMQ). mythic-container 0.6.14 reads connection config ONLY from
  # rabbitmq_config.json in the working dir (/Mythic) - env vars do not
  # affect the broker (Dynaconf has no envvar prefix), so the single-file
  # bind mount is the whole mechanism.
  mythic_apollo:
    image: ghcr.io/mythicagents/apollo:v0.0.1.19
    profiles: ["mythic"]
    volumes:
      - ./mythic/apollo/rabbitmq_config.json:/Mythic/rabbitmq_config.json:ro
    depends_on:
      - mythic_rabbitmq
      - mythic_server
    networks:
      - c2_core
    restart: unless-stopped

  # HTTP C2 profile container (MythicC2Profiles/http). Same self-registration
  # pattern as Apollo, but uses MythicContainer v1.5.1 (Go, not Python) and
  # reads broker config from env vars (RABBITMQ_HOST etc.) - no
  # rabbitmq_config.json mount needed. Serves the actual HTTP listener on :80
  # that agents call back to; the redirector proxies /cdn/media/stream here.
  mythic_http:
    image: ghcr.io/mythicc2profiles/http:v0.0.3.2
    profiles: ["mythic"]
    environment:
      RABBITMQ_HOST: mythic_rabbitmq
      RABBITMQ_PASSWORD: mythic
      MYTHIC_SERVER_HOST: mythic_server
      MYTHIC_SERVER_GRPC_PORT: "17444"
      # REST port for FILE-type build parameters. httpx pulls its
      # raw_c2_config over GET /direct/download/<agent_file_id>; without this
      # the config check fails with
      # "Error getting agent_config: Failed to read file from Mythic ... 404".
      MYTHIC_SERVER_PORT: "17443"
    depends_on:
      - mythic_rabbitmq
      - mythic_server
    networks:
      - c2_core
      - c2_edge
    restart: unless-stopped

  # Malleable HTTP C2 profile (MythicC2Profiles/httpx) - the community-driven,
  # JSON/TOML-configurable profile: callback domains + rotation/failover,
  # AES256-keyed HMAC, and agent message placement/transforms (base64/xor/
  # netbios...) supplied per build. Same Go self-registration model as
  # mythic_http, but its listener is :82 (its config.json) and it is routed by
  # its own prefix (/media/uploads) so both profiles can be live at once.
  mythic_httpx:
    image: ghcr.io/mythicc2profiles/httpx:v0.0.0.20
    profiles: ["mythic"]
    environment:
      RABBITMQ_HOST: mythic_rabbitmq
      RABBITMQ_PASSWORD: mythic
      MYTHIC_SERVER_HOST: mythic_server
      MYTHIC_SERVER_GRPC_PORT: "17444"
      # httpx needs the REST port too: its config-check RPC reads the FILE-type
      # raw_c2_config build parameter via GET /direct/download/<agent_file_id>.
      MYTHIC_SERVER_PORT: "17443"
    volumes:
      # httpx registers its gin routes ONLY from agent_configs.json, and it is
      # written into the container filesystem by the build's config-check step.
      # Without a volume every recreate/reboot wipes it back to "{}" and the
      # listener accepts TCP but serves no routes (502 through the redirector).
      # Mounting our own seed config guarantees routes exist from first boot;
      # the build still merges its own variations into the file at runtime.
      - ./mythic/httpx/agent_config.json:/Mythic/httpx/c2_code/agent_configs.json
    depends_on:
      - mythic_rabbitmq
      - mythic_server
    networks:
      - c2_core
      - c2_edge
    restart: unless-stopped

  mythic_postgres:
    image: postgres:15
    profiles: ["mythic"]
    environment:
      POSTGRES_USER: mythic_user
      POSTGRES_PASSWORD: mythic
      POSTGRES_DB: mythic_db
    volumes:
      - mythic_postgres:/var/lib/postgresql/data
    networks:
      - c2_core
    restart: unless-stopped

  mythic_rabbitmq:
    image: rabbitmq:3-management
    profiles: ["mythic"]
    environment:
      RABBITMQ_DEFAULT_USER: mythic_user
      RABBITMQ_DEFAULT_PASS: mythic
      RABBITMQ_DEFAULT_VHOST: mythic_vhost
    networks:
      - c2_core
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Adaptix C2 (profile-gated: enable with --profile adaptix)
  # Go-based post-exploitation framework. Teamserver listens on :4321
  # for the Qt GUI client; HTTP C2 traffic arrives through the redirector
  # on :80 (ADAPTIX_URI_PREFIX). Extenders: HTTP/S, DNS/DoH, SMB, TCP
  # beacon + Gopher TCP/mTLS agent.
  # ------------------------------------------------------------------
  adaptix:
    build:
      # Vendored in-tree source: Docker/adaptix/src (upstream AdaptixC2 tree,
      # GPL-3.0). Builds server + extenders; the Qt GUI client runs on Kali.
      context: ./adaptix
    profiles: ["adaptix"]
    volumes:
      - adaptix_data:/app/data
    ports:
      # Explicit 0.0.0.0 host binding: a bare "${PORT}:4321" mapping renders
      # as a no-host-IP publish that Docker Desktop fails to proxy.
      - "0.0.0.0:${ADAPTIX_TS_PORT}:4321"
    networks:
      # c2_edge required: the teamserver port (Qt client) is published to the
      # host, and Docker drops port publishing for containers that are only on
      # the internal c2_core network (NetworkSettings.Ports stays empty).
      - c2_core
      - c2_edge
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Meridian C2 — Lightweight Dual-Transport (HTTP/S + DNS TXT) C2
  # Zero-dependency Go implant + async Python daemon.
  # HTTP callbacks routed via redirector on :80 (MERIDIAN_URI_PREFIX).
  # DNS C2 listener exposed on UDP port 5353 for DNS covert tunneling.
  # ------------------------------------------------------------------
  meridian:
    build:
      context: ./meridian
    volumes:
      - meridian_data:/root/.meridian
    environment:
      MERIDIAN_URI_PREFIX: ${MERIDIAN_URI_PREFIX:-/gateway/v1/telemetry}
      # Only used when seeding config.json on a FRESH state volume; an existing
      # meridian_data volume keeps the domain it was created with (see
      # Doc/Docker.md for the migration note).
      MERIDIAN_DNS_DOMAIN: ${MERIDIAN_DNS_DOMAIN:-c2.cadre.local}
      # Backend header gate: the HTTP listener itself rejects requests without
      # this header (404), so anything reaching meridian:8080 directly — not
      # just through the redirector — is gated too. Same values as the
      # redirector gate; unset to disable (direct-backend lab use).
      MERIDIAN_REQUIRE_HEADER_NAME: ${C2_HEADER_NAME:-X-Request-ID}
      MERIDIAN_REQUIRE_HEADER_VALUE: ${C2_HEADER_VALUE:-cadre-c2}
    ports:
      - "${MERIDIAN_DNS_PORT}:5353/udp"
    networks:
      - c2_core
      - c2_edge
    restart: unless-stopped

  # ------------------------------------------------------------------
  # C2Stack Portal — Flight Control & Visual Learning Hub
  # Single web management UI for Docker container orchestration,
  # real-time OPSEC redirector tracing, DNS TXT covert channel
  # dissection, cross-framework payload generation, and fleet radar.
  # ------------------------------------------------------------------
  portal:
    build:
      context: ./portal
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # The docker CLI is installed in the image (see portal/Dockerfile), so
      # c2backends.py can `docker exec` psql (Mythic) and the meridian CLI.
      # Tasking + victim commands run over SSH as the lab operator.
      - "${WS01_SSH_KEY_PATH:-/dev/null}:/root/.ssh/cadre-ws01-key:ro"
    environment:
      REDIRECTOR_HOST: redirector
      REDIRECTOR_HTTP_PORT: ${REDIRECTOR_HTTP_PORT:-80}
      C2_HEADER_NAME: ${C2_HEADER_NAME:-X-Request-ID}
      C2_HEADER_VALUE: ${C2_HEADER_VALUE:-cadre-c2}
      MYTHIC_ENDPOINT: http://mythic_server:17443
      MYTHIC_USERNAME: ${MYTHIC_ADMIN_USERNAME:-mythic_admin}
      MYTHIC_PASSWORD: ${MYTHIC_ADMIN_PASSWORD:-mythic}
      MYTHIC_DB_CONTAINER: c2stack-mythic_postgres-1
      WS01_SSH: "${WS01_SSH_TARGET:-analyst_t1@192.168.77.62}"
      WS01_SSH_KEY: /root/.ssh/cadre-ws01-key
      MERIDIAN_URI_PREFIX: ${MERIDIAN_URI_PREFIX:-/gateway/v1/telemetry}
      SLIVER_URI_PREFIX: ${SLIVER_URI_PREFIX:-/cloud/storage/objects}
      HAVOC_URI_PREFIX: ${HAVOC_URI_PREFIX:-/edge/cache/assets}
      ADAPTIX_URI_PREFIX: ${ADAPTIX_URI_PREFIX:-/api/v1/sync}
      MYTHIC_URI_PREFIX: ${MYTHIC_URI_PREFIX:-/cdn/media/stream}
      MERIDIAN_DNS_PORT: ${MERIDIAN_DNS_PORT:-15353}
      MERIDIAN_DNS_DOMAIN: ${MERIDIAN_DNS_DOMAIN:-c2.cadre.local}
      SLIVER_CTRL_PORT: ${SLIVER_CTRL_PORT:-31337}
      HAVOC_TS_PORT: ${HAVOC_TS_PORT:-40056}
      ADAPTIX_TS_PORT: ${ADAPTIX_TS_PORT:-4321}
      MYTHIC_UI_PORT: ${MYTHIC_UI_PORT:-7443}
    ports:
      - "${PORTAL_PORT:-8000}:8000"
    networks:
      - c2_core
      - c2_edge
    restart: unless-stopped


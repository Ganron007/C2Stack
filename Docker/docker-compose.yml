# ============================================================================
# C2Stack — Docker Practice Lab
# Redirector + Mythic + Sliver + Havoc. The Kali VM is the operator
# workstation (runs sliver-client / havoc client / browser to Mythic UI).
#
# Bring everything up:
#   docker compose --env-file .env up -d --build
# Bring up everything EXCEPT Mythic (Mythic needs first-run network access):
#   docker compose --env-file .env up -d --build --profile mythic
#
# Networks:
#   c2_edge  - redirector publishes its victim-facing port here
#   c2_core  - internal back-channel; C2 frameworks are only reachable through
#              the redirector (no direct internet egress)
# ============================================================================

networks:
  c2_edge:
    name: ${C2_EDGE_NETWORK}
  c2_core:
    name: ${C2_CORE_NETWORK}
    internal: true

volumes:
  sliver_data:
  havoc_data:
  mythic_postgres:

services:
  # ------------------------------------------------------------------
  # Redirector — Apache reverse proxy with header-based C2 routing.
  # The ONLY service exposed to the victim/CADRE network.
  # ------------------------------------------------------------------
  redirector:
    build:
      context: ./redirector
    environment:
      C2_HEADER_NAME: ${C2_HEADER_NAME}
      C2_HEADER_VALUE: ${C2_HEADER_VALUE}
      MYTHIC_URI_PREFIX: ${MYTHIC_URI_PREFIX}
      SLIVER_URI_PREFIX: ${SLIVER_URI_PREFIX}
      HAVOC_URI_PREFIX: ${HAVOC_URI_PREFIX}
      MYTHIC_BACKEND_HOST: ${MYTHIC_BACKEND_HOST}
      MYTHIC_BACKEND_PORT: ${MYTHIC_BACKEND_PORT}
      SLIVER_BACKEND_HOST: ${SLIVER_BACKEND_HOST}
      SLIVER_BACKEND_PORT: ${SLIVER_BACKEND_PORT}
      HAVOC_BACKEND_HOST: ${HAVOC_BACKEND_HOST}
      HAVOC_BACKEND_PORT: ${HAVOC_BACKEND_PORT}
    ports:
      - "${REDIRECTOR_HTTP_PORT}:80"
    networks:
      - c2_edge
      - c2_core
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Sliver C2
  # ------------------------------------------------------------------
  sliver:
    build:
      context: ./sliver
    volumes:
      - sliver_data:/root/.sliver
    ports:
      - "${SLIVER_CTRL_PORT}:31337"
    networks:
      - c2_core
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Havoc C2 (teamserver)
  # ------------------------------------------------------------------
  havoc:
    build:
      context: ./havoc
    volumes:
      - havoc_data:/opt/havoc/teamserver/Data
    ports:
      - "${HAVOC_TS_PORT}:40056"
    networks:
      - c2_core
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Mythic C2 (profile-gated: enable with --profile mythic)
  # Standard Mythic stack. The http C2 profile is exposed as `mythic`
  # so the redirector can proxy ${MYTHIC_URI_PREFIX} to it.
  # First run pulls images and installs the http profile via the Mythic UI.
  # ------------------------------------------------------------------
  mythic_server:
    image: itsafeaturemythic/mythic_server:latest
    profiles: ["mythic"]
    ports:
      - "${MYTHIC_UI_PORT}:7443"
    volumes:
      - ./mythic/server:/mythic
    depends_on:
      - mythic_postgres
      - mythic_rabbitmq
    networks:
      - c2_core
    restart: unless-stopped

  mythic_postgres:
    image: postgres:13
    profiles: ["mythic"]
    environment:
      POSTGRES_USER: mythic
      POSTGRES_PASSWORD: mythic
      POSTGRES_DB: mythic
    volumes:
      - mythic_postgres:/var/lib/postgresql/data
    networks:
      - c2_core
    restart: unless-stopped

  mythic_rabbitmq:
    image: rabbitmq:3
    profiles: ["mythic"]
    networks:
      - c2_core
    restart: unless-stopped

  mythic:
    image: itsafeaturemythic/mythic_c2_http:latest
    profiles: ["mythic"]
    depends_on:
      - mythic_rabbitmq
    networks:
      - c2_core
    restart: unless-stopped
